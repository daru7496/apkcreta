<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Creta OEM Launcher — Key Largo 980</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --ui-font: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--ui-font);
      background: #0A0D12;
      color: #E8EEF5;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }
    .dock {
      width: 78px;
      background: #0E131B;
      border-right: 1px solid rgba(148,163,184,0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px 8px;
      flex-shrink: 0;
    }
    .dock-group { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .dock-btn {
      width: 100%;
      height: 54px;
      border-radius: 14px;
      border: 1px solid transparent;
      background: transparent;
      color: #8A96A8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .dock-btn.active {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.35);
      color: #38BDF8;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 22px;
      gap: 14px;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
    }
    .brand { font-size: 16px; font-weight: 700; letter-spacing: 0.02em; color: #F1F5F9; }
    .meta { font-size: 12px; color: #8A96A8; }
    .clock { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: #E8EEF5; }
    .grid-home {
      flex: 1;
      display: grid;
      grid-template-columns: 1.2fr 1fr 0.85fr;
      gap: 14px;
      min-height: 0;
    }
    .card {
      background: linear-gradient(160deg, #161C26 0%, #0D1118 100%);
      border: 1px solid rgba(148,163,184,0.14);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }
    .hero-car {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 10px;
      background: #090C11;
    }
    .album-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: auto 0;
    }
    .album-art {
      width: 78px;
      height: 78px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .card-label { font-size: 12px; color: #38BDF8; font-weight: 600; }
    .card-title { font-size: 22px; font-weight: 700; margin-top: 2px; }
    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .oem-btn {
      min-height: 48px;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.18);
      background: rgba(255,255,255,0.04);
      color: #E8EEF5;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .oem-btn.primary {
      background: var(--accent-dark);
      border-color: var(--accent);
      color: #FFFFFF;
    }
    .apps-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      overflow-y: auto;
      align-content: start;
    }
    .app-tile {
      background: #141A24;
      border: 1px solid rgba(148,163,184,0.14);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 6px;
      cursor: pointer;
      min-height: 88px;
      text-align: left;
    }
    .app-tile:active { transform: scale(0.97); border-color: #38BDF8; }
    .app-name { font-size: 15px; font-weight: 600; color: #F1F5F9; }
    .app-pkg { font-size: 11px; color: #64748B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="bootSplash" onclick="this.style.display='none'" style="position:fixed;inset:0;z-index:100;background:#000000;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:44px;gap:8px;cursor:pointer;font-family:'Outfit',sans-serif;overflow:hidden;">

    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.75) 0%,rgba(0,0,0,0.35) 50%,rgba(0,0,0,0.7) 100%);pointer-events:none;"></div>
    <div style="position:relative;z-index:2;font-size:38px;font-weight:700;letter-spacing:0.34em;color:#FFFFFF;padding-left:0.34em;text-shadow:0 6px 24px rgba(0,0,0,0.9);">HYUNDAI</div>
    <div style="position:relative;z-index:2;font-size:16px;font-weight:500;letter-spacing:0.52em;color:#E2E8F0;padding-left:0.52em;text-shadow:0 4px 16px rgba(0,0,0,0.9);">CRETA</div>
  </div>

  <div id="screenSaver" onclick="closeScreenSaver()" class="hidden" style="position:fixed;inset:0;z-index:90;background:#05080E;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden;padding:24px;">
    <svg viewBox="0 0 800 480" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;opacity:0.9;pointer-events:none;">
      <rect width="800" height="480" fill="#070C14"/>
      <rect x="48" y="110" width="160" height="96" rx="14" fill="#0E1722"/>
      <rect x="520" y="96" width="210" height="108" rx="14" fill="#0D1920"/>
      <rect x="64" y="290" width="190" height="120" rx="14" fill="#0E1722"/>
      <rect x="480" y="300" width="240" height="118" rx="14" fill="#0E1722"/>
      <g stroke="#172334" stroke-width="8" stroke-linecap="round">
        <line x1="0" y1="150" x2="800" y2="150"/>
        <line x1="0" y1="350" x2="800" y2="350"/>
        <line x1="170" y1="0" x2="170" y2="480"/>

      </g>

      <circle cx="695" cy="108" r="8" fill="#38bdf8" stroke="#fff" stroke-width="2"/>

        <path d="M 0 -9 L 8 7 L 0 3.5 L -8 7 Z" fill="#38bdf8"/>
      </g>
    </svg>
    <div id="ssDestBadge" style="position:absolute;top:16px;left:16px;z-index:3;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.16);border-radius:10px;padding:6px 12px;font-size:12px;color:#E2E8F0;">To: Cyber Hub, Gurugram</div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.2) 0%,rgba(0,0,0,0.05) 50%,rgba(0,0,0,0.3) 100%);pointer-events:none;"></div>
    <div style="position:relative;z-index:2;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;padding-top:24px;">
      <div id="ssTime" style="font-size:60px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,0.9);">--:--</div>
      <div id="ssDay" style="font-size:20px;font-weight:600;color:#38bdf8;margin-top:4px;text-shadow:0 4px 16px rgba(0,0,0,0.9);">--</div>
      <div id="ssDate" style="font-size:13px;color:#E2E8F0;margin-top:2px;text-shadow:0 2px 10px rgba(0,0,0,0.9);">--</div>

      <div id="ssMusicBox" onclick="event.stopPropagation()" style="margin-top:16px;width:350px;max-width:90vw;border-radius:12px;background:#000000;border:1px solid rgba(255,255,255,0.25);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;opacity:0.4;">
        <div style="text-align:left;min-width:0;flex:1;">
          <div id="ssTrackTitle" style="font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Midnight Expressway</div>
          <div id="ssTrackArtist" style="font-size:11px;color:#CBD5E1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">The Midnight</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
          <button onclick="ssPrevSong()" style="width:34px;height:34px;border-radius:10px;border:0;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8);font-size:12px;cursor:pointer;">⏮</button>
          <button id="ssPlayBtn" onclick="ssTogglePlay()" style="width:34px;height:34px;border-radius:10px;border:0;background:rgba(56,189,248,0.28);color:#E0F2FE;font-size:12px;cursor:pointer;">⏸</button>
          <button onclick="ssNextSong()" style="width:34px;height:34px;border-radius:10px;border:0;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8);font-size:12px;cursor:pointer;">⏭</button>
        </div>

      <div id="ssYtBox" onclick="event.stopPropagation()" class="hidden" style="margin-top:14px;width:350px;max-width:90vw;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000000;border:1px solid rgba(255,255,255,0.25);opacity:0.5;">
        <div id="ssYtSlot" style="width:100%;height:100%;"></div>
      </div>
    </div>
  </div>
  <iframe id="ytFrame" src="https://www.youtube.com/embed/jfKfPfyJRdk?enablejsapi=1&rel=0&modestbranding=1&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen style="position:fixed;border:0;border-radius:12px;z-index:15;left:-9999px;top:-9999px;width:320px;height:180px;"></iframe>

  <aside class="dock" style="width:60px;">
    <div class="dock-group">
      <button class="dock-btn" onclick="openScreenSaver()">OFF</button>
      <button class="dock-btn" onclick="showTab('home')">HOME</button>
      <button class="dock-btn" onclick="showTab('home')">RETURN</button>
      <button class="dock-btn" onclick="launchMapped('settings')">SETUP</button>
      <button class="dock-btn" onclick="toggleAppsTab()">APPS</button>
    </div>
    <div class="dock-group">
      <button class="dock-btn" onclick="adjustVol(2)">VOL +</button>
      <button class="dock-btn" onclick="adjustVol(-2)">VOL -</button>
      <button class="dock-btn" onclick="openHomePicker()">DEFAULT</button>
    </div>
  </aside>

  <main class="main">
    <section class="grid-home" id="tab-home">
      <div class="card" style="padding:0;overflow:hidden;">
        <div onclick="launchMapped('maps')" style="flex:1;background:#0B111A;cursor:pointer;position:relative;">

          </svg>
          <div onclick="event.stopPropagation();toggleDestSearch()" style="position:absolute;top:12px;left:12px;display:flex;align-items:center;">
            <div id="destLabel" style="background:rgba(13,19,28,0.88);border:1px solid rgba(148,163,184,0.25);padding:5px 10px;border-radius:10px;font-size:11px;font-weight:600;color:#E8EEF5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;">

          </div>
          <div id="destSearchBox" onclick="event.stopPropagation()" class="hidden" style="position:absolute;top:48px;left:12px;right:12px;background:rgba(13,19,28,0.96);border:1px solid rgba(148,163,184,0.35);border-radius:10px;padding:8px;display:flex;gap:6px;">
            <input id="destInput" type="text" placeholder="Search destination..." style="flex:1;height:32px;border-radius:6px;border:1px solid #334155;background:#090D14;color:#fff;padding:0 8px;font-size:12px;" />
            <button onclick="applyDestination()" style="height:32px;padding:0 10px;border-radius:6px;border:0;background:#0284c7;color:#fff;font-size:11px;font-weight:600;cursor:pointer;">Go</button>

        <div class="action-row" style="padding:14px;margin-top:0;">

          <button class="oem-btn" onclick="launchMapped('zlink')">CarPlay</button>
        </div>
      </div>

      <div class="card" style="gap:8px;padding:12px;background:linear-gradient(155deg,#EFEAFF 0%,#E6DDFC 52%,#DDD2FA 100%);border:2px solid #2563EB;color:#1E1B4B;box-shadow:0 12px 28px rgba(37,99,235,0.2);">
        <button id="btnYt" class="oem-btn" style="min-height:32px;padding:0 12px;font-size:11px;background:rgba(245,242,255,0.92);border:2px solid #2563EB;color:#1E1B4B;display:flex;align-items:center;justify-content:space-between;" onclick="switchMedia('yt')"><span>▶ Video</span><span style="color:#1D4ED8;opacity:0.8;">⛶</span></button>
        <div id="homeYtSlot" style="flex:1;min-height:110px;border-radius:14px;overflow:hidden;background:#000000;border:2px solid #2563EB;box-shadow:0 6px 18px rgba(37,99,235,0.18);"></div>
        <div style="display:flex;gap:6px;">
          <button class="oem-btn" style="flex:1;min-height:36px;border:0;border-radius:14px;background:rgba(59,130,246,0.15);color:#1E1B4B;" onclick="ytPrev()">⏮</button>
          <button id="homeYtPlayBtn" class="oem-btn" style="flex:1;min-height:36px;border:0;border-radius:14px;background:rgba(37,99,235,0.3);color:#1E1B4B;" onclick="toggleHomeYt()">⏸</button>
          <button class="oem-btn" style="flex:1;min-height:36px;border:0;border-radius:14px;background:rgba(59,130,246,0.15);color:#1E1B4B;" onclick="ytNext()">⏭</button>
        </div>

        <div style="border-top:2px solid #9CA3AF;padding-top:8px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;">
          <div style="display:flex;gap:5px;">
            <div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(228,220,252,0.9);border:2px solid #2563EB;padding:3px;border-radius:10px;">
              <button id="modeSp" onclick="setMusicMode('sp')" aria-label="Streaming" style="min-height:28px;border:0;border-radius:7px;background:rgba(37,99,235,0.2);color:#1D4ED8;font-size:12px;cursor:pointer;">♫</button>
              <button id="modeBt" onclick="setMusicMode('bt')" aria-label="Bluetooth" style="min-height:28px;border:0;border-radius:7px;background:transparent;color:rgba(30,27,75,0.55);font-size:12px;cursor:pointer;">ᛒ</button>
              <button id="modeFm" onclick="setMusicMode('fm')" aria-label="Radio" style="min-height:28px;border:0;border-radius:7px;background:transparent;color:rgba(30,27,75,0.55);font-size:12px;cursor:pointer;">📻</button>
              <button id="modeUsb" onclick="setMusicMode('usb')" aria-label="USB" style="min-height:28px;border:0;border-radius:7px;background:transparent;color:rgba(30,27,75,0.55);font-size:12px;cursor:pointer;">🔌</button>

          <div id="homeSpBox" style="height:76px;border-radius:12px;overflow:hidden;background:#000000;border:2px solid #000000;">

            <div id="homeAudioSub" style="font-size:11px;color:rgba(30,27,75,0.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;">The Midnight</div>

          <div style="display:flex;gap:6px;">
            <button class="oem-btn" style="flex:1;min-height:36px;border:0;border-radius:14px;background:#0F2A5E;color:#E0F2FE;" onclick="ssPrevSong()">⏮</button>
            <button id="homeMusicPlayBtn" class="oem-btn" style="flex:1;min-height:36px;border:0;border-radius:14px;background:#172554;color:#FFFFFF;" onclick="ssTogglePlay()">⏸</button>
            <button class="oem-btn" style="flex:1;min-height:36px;border:0;border-radius:14px;background:#0F2A5E;color:#E0F2FE;" onclick="ssNextSong()">⏭</button>

      </div>

      <div style="display:flex;flex-direction:column;gap:14px;min-height:0;">
        <div class="card" style="padding:16px;flex-shrink:0;">
          <div class="clock" id="clockLarge" style="font-size:28px;">--:--</div>
          <p class="meta" id="dateLarge" style="margin-top:4px;">--</p>
        </div>

        <div class="card" style="flex:1;padding:12px;gap:10px;min-height:0;">
          <div style="display:flex;background:rgba(0,0,0,0.4);padding:3px;border-radius:10px;gap:4px;">

            <button id="btnFrontCam" class="oem-btn" style="flex:1;min-height:32px;font-size:11px;background:transparent;border-color:transparent;" onclick="switchCam('front')">Front Cam</button>

              <polygon points="0,200 130,92 190,92 320,200" fill="#1E293B"/>
              <line x1="160" y1="94" x2="160" y2="200" stroke="#E2E8F0" stroke-width="3" stroke-dasharray="14 14"/>
              <line x1="138" y1="95" x2="62" y2="195" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
              <line x1="182" y1="95" x2="258" y2="195" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
            </svg>
            <div id="camHud" style="position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.72);color:#fff;font-size:10px;padding:2px 6px;border-radius:5px;">AHD REAR · LIVE</div>
          </div>
        </div>
      </div>

    const cfg = window.__CRETA_CONFIG__;

    var ssPts = [[160,455],[265,335],[390,264],[560,196],[695,108]];
    var homePts = [[190,245],[190,148],[285,112],[365,55]];
    var ssProg = 0.15;
    function interpPts(pts, t) {
      var sc = Math.max(0, Math.min(0.9999, t)) * (pts.length - 1);
      var i = Math.floor(sc), lt = sc - i;
      var a = pts[i], b = pts[Math.min(pts.length - 1, i + 1)];
      var x = a[0] + (b[0] - a[0]) * lt;
      var y = a[1] + (b[1] - a[1]) * lt;
      var deg = (Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI) + 90;
      return { x: x, y: y, deg: deg };
    }
    setInterval(function() {
      ssProg = (ssProg + 0.012) >= 1 ? 0.04 : ssProg + 0.012;
      var sCar = interpPts(ssPts, ssProg);
      var car = document.getElementById('ssCarMarker');
      if (car) car.setAttribute('transform', 'translate(' + sCar.x.toFixed(1) + ',' + sCar.y.toFixed(1) + ') rotate(' + sCar.deg.toFixed(1) + ')');
      var hCar = interpPts(homePts, ssProg);
      var homeMarker = document.getElementById('homeCarMarker');
      if (homeMarker) homeMarker.setAttribute('transform', 'translate(' + hCar.x.toFixed(1) + ',' + hCar.y.toFixed(1) + ') rotate(' + hCar.deg.toFixed(1) + ')');
      var km = Math.max(0.2, (1 - ssProg) * 6.8).toFixed(1);
      var badge = document.getElementById('ssDestBadge');
      if (badge) badge.textContent = activeDest + ' · ' + km + ' km';
    }, 120);

    function toggleDestSearch() {
      var box = document.getElementById('destSearchBox');
      box.classList.toggle('hidden');
      if (!box.classList.contains('hidden')) document.getElementById('destInput').focus();
    }

    function applyDestination() {
      var val = document.getElementById('destInput').value.trim();
      if (val) {
        activeDest = val;
        document.getElementById('destLabel').textContent = activeDest;
      }
      document.getElementById('destSearchBox').classList.add('hidden');
    }

    function syncYtFramePosition() {
      var frame = document.getElementById('ytFrame');
      if (!frame) return;
      var saverOpen = !document.getElementById('screenSaver').classList.contains('hidden');
      var target = null;
      if (saverOpen && activeProvider === 'yt' && ytPlayingApk) {
        target = document.getElementById('ssYtSlot');
        frame.style.zIndex = '95';
        frame.style.opacity = '0.5';
        frame.style.border = '0';
      } else if (!saverOpen && currentApkTab === 'home') {
        target = document.getElementById('homeYtSlot');
        frame.style.zIndex = '15';
        frame.style.opacity = '1';
        frame.style.border = '2px solid #2563EB';
      } else if (!saverOpen && currentApkTab === 'streaming' && activeProvider === 'yt') {
        target = document.getElementById('fullStreamSlot');
        frame.style.zIndex = '15';
        frame.style.opacity = '1';
        frame.style.border = '2px solid #2563EB';
      }
      if (!target) {
        frame.style.left = '-9999px';
        frame.style.top = '-9999px';
        return;
      }
      var r = target.getBoundingClientRect();
      frame.style.left = r.left + 'px';
      frame.style.top = r.top + 'px';
      frame.style.width = r.width + 'px';
      frame.style.height = r.height + 'px';
    }
    window.addEventListener('resize', syncYtFramePosition);

    setTimeout(function() {
      var splash = document.getElementById('bootSplash');
      if (splash) splash.style.display = 'none';
      syncYtFramePosition();
    }, 2000);

    function openScreenSaver() {
      var saver = document.getElementById('screenSaver');
      saver.classList.remove('hidden');
      var ytBox = document.getElementById('ssYtBox');
      var musicBox = document.getElementById('ssMusicBox');
      if (activeProvider === 'yt' && ytPlayingApk) {
        ytBox.classList.remove('hidden');
        musicBox.classList.add('hidden');
      } else {
        ytBox.classList.add('hidden');
        musicBox.classList.remove('hidden');
      }
      requestAnimationFrame(syncYtFramePosition);
    }

    function closeScreenSaver() {
      document.getElementById('screenSaver').classList.add('hidden');
      requestAnimationFrame(syncYtFramePosition);
    }

    function resetIdleSaver() {
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(function() {
        openScreenSaver();
      }, 15000);
    }
    document.addEventListener('pointerdown', resetIdleSaver);
    resetIdleSaver();

    var musicMode = 'sp';

    var ytIdxApk = 0;
    var ytPlayingApk = false;

    function setMusicMode(m) {
      if (musicMode === 'sp' && m === 'sp') {
        switchMedia('sp');
        return;
      }
      musicMode = m;
      ['sp', 'bt', 'fm', 'usb'].forEach(function(k) {
        var btn = document.getElementById('mode' + k.charAt(0).toUpperCase() + k.slice(1));
        if (btn) {
          btn.style.background = k === m ? 'rgba(37,99,235,0.2)' : 'transparent';
          btn.style.color = k === m ? '#1D4ED8' : 'rgba(30,27,75,0.55)';
        }
      });
      document.getElementById('homeSpBox').classList.toggle('hidden', m !== 'sp');
      document.getElementById('homeAudioBox').classList.toggle('hidden', m === 'sp');
      if (m === 'fm') {
        document.getElementById('homeAudioTitle').textContent = '98.3 MHz · Mirchi 98.3';
        document.getElementById('homeAudioSub').textContent = 'FM1 Tuner';
      } else if (m === 'usb') {

        document.getElementById('homeAudioSub').textContent = 'USB Audio';

        document.getElementById('homeAudioSub').textContent = ssTracks[ssTrackIdx].artist + ' · BT Audio';

    function switchMedia(p) {
      activeProvider = p;

      openStreamingSearch();

    function openStreamingSearch() {
      showTab('streaming');
      var frame = document.getElementById('fullStreamFrame');
      var slot = document.getElementById('fullStreamSlot');

        if (slot) slot.style.borderColor = '#000000';
        frame.classList.remove('hidden');
        frame.src = 'https://open.spotify.com/embed/' + currentSpPath + '?utm_source=generator&theme=0';
      } else {
        if (slot) slot.style.borderColor = '#3B82F6';
        frame.classList.add('hidden');
        ytPlayingApk = true;
      }
      requestAnimationFrame(syncYtFramePosition);
    }

    function applyStreamSearch() {
      var q = document.getElementById('streamSearchInput').value.trim();
      if (!q) return;
      if (activeProvider === 'yt') {
        var m = q.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/) || (/^[a-zA-Z0-9_-]{11}$/.test(q) ? [q, q] : null);
        if (m && m[1]) currentYtId = m[1];
        ytPlayingApk = true;
        document.getElementById('ytFrame').src = 'https://www.youtube.com/embed/' + currentYtId + '?enablejsapi=1&autoplay=1&rel=0&playsinline=1';
      } else {
        var sp = q.match(/open\.spotify\.com\/(?:embed\/)?(track|playlist|album|artist)\/([a-zA-Z0-9]+)/);
        if (sp) currentSpPath = sp[1] + '/' + sp[2];
        var spSrc = 'https://open.spotify.com/embed/' + currentSpPath + '?utm_source=generator&theme=0';
        document.getElementById('fullStreamFrame').src = spSrc;
        document.getElementById('spFrame').src = spSrc;
      }
    }

    function updateClock() {
      const now = new Date();
      const t = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      document.getElementById('ssDay').textContent = now.toLocaleDateString([], { weekday: 'long' });

      { title: 'Coastal Overdrive', artist: 'Kalax' },

      var t = ssTracks[ssTrackIdx];

      ssTrackIdx = (ssTrackIdx - 1 + ssTracks.length) % ssTracks.length;
      ssPlaying = true;
      renderSsTrack();
    }
    function ssNextSong() {
      ssTrackIdx = (ssTrackIdx + 1) % ssTracks.length;
      ssPlaying = true;
      renderSsTrack();
    }
    function ssTogglePlay() {
      ssPlaying = !ssPlaying;
      renderSsTrack();
    }

    function toggleAppsTab() {
      showTab(currentApkTab === 'apps' ? 'home' : 'apps');
    }

    window.onAndroidBackPressed = function() {
      showTab('home');
    };

    function launchPackage(pkg) {
      if (window.CretaAndroidBridge && window.CretaAndroidBridge.launchApp) {
        window.CretaAndroidBridge.launchApp(pkg);
      } else {
        alert('Android Bridge inactive outside APK. Package: ' + pkg);
      }
    }

    function launchMapped(id) {
      const found = (cfg.apps || []).find(a => a.id === id);
      if (found) launchPackage(found.packageName);
    }

    function adjustVol(delta) {
      currentVol = Math.max(0, Math.min(30, currentVol + delta));
      var el = document.getElementById('volDisplay');
      if (el) el.textContent = 'Vol ' + currentVol;
      if (window.CretaAndroidBridge && window.CretaAndroidBridge.setVolume) {
        window.CretaAndroidBridge.setVolume(currentVol);
      }
    }

    function openHomePicker() {
      if (window.CretaAndroidBridge && window.CretaAndroidBridge.openDefaultHomePicker) {
        window.CretaAndroidBridge.openDefaultHomePicker();
      }
    }

    function renderApps() {
      const container = document.getElementById('tab-apps');
      container.innerHTML = '';

      (cfg.apps || []).forEach(app => {
        const btn = document.createElement('button');
        btn.className = 'app-tile';
        btn.onclick = () => launchPackage(app.packageName);
        btn.innerHTML = '<div class="app-name">' + app.label + '</div><div class="app-pkg">' + app.packageName + '</div>';
        container.appendChild(btn);
      });

      if (window.CretaAndroidBridge && window.CretaAndroidBridge.getInstalledApps) {
        try {
          const installed = JSON.parse(window.CretaAndroidBridge.getInstalledApps());
          installed.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'app-tile';
            btn.onclick = () => launchPackage(item.packageName);
            btn.innerHTML = '<div class="app-name">' + item.label + '</div><div class="app-pkg">' + item.packageName + '</div>';
            container.appendChild(btn);
          });
        } catch (e) {}
      }
    }
